services:
  da3:
    build:
      context: .
      args:
        TORCH_CUDA: ${TORCH_CUDA:-cu124}
        TORCH_VERSION: ${TORCH_VERSION:-2.6.0}
        BAKE_MODELS: ${BAKE_MODELS:-da3-small da3-base da3-large}
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    image: da3-video:latest
    restart: unless-stopped
    ports:
      # localhost + one LAN address only (not VPN / Netbird), no auth
      - "127.0.0.1:${DA3_PORT:-8000}:8000"
      - "${DA3_LAN_IP:?set DA3_LAN_IP in .env}:${DA3_PORT:-8000}:8000"
    environment:
      ALLOWED_ROOTS: ${PROJECTS_DIR:?set PROJECTS_DIR in .env}
      HF_HOST_CACHE: /hf-host/hub
      HF_HUB_OFFLINE: ${HF_HUB_OFFLINE:-0}   # 1 on air-gapped machines: never try to download weights
      DA3_LOG_LEVEL: WARN
      GRADIO_TEMP_DIR: /data/gradio-cache
      UI_USER: ${UI_USER:-da3}
      UI_PASSWORD: ${UI_PASSWORD:-}
      HIGGSFIELD_KEY_ID: ${HIGGSFIELD_KEY_ID:-}
      HIGGSFIELD_KEY_SECRET: ${HIGGSFIELD_KEY_SECRET:-}
      HIGGSFIELD_MAX_CONCURRENT: ${HIGGSFIELD_MAX_CONCURRENT:-4}
      HIGGSFIELD_BASE_URL: ${HIGGSFIELD_BASE_URL:-https://api.higgsfield.ai}
    volumes:
      # mounted at the same path as on the host so Nuke paths work as-is
      - ${PROJECTS_DIR}:${PROJECTS_DIR}
      - ./data:/data
      - ${HF_CACHE_DIR:-~/.cache/huggingface}:/hf-host
    shm_size: 2gb
    # rotate container logs: at most 5 x 10 MB
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
